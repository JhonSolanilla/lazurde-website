<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lazurde Admin</title>
<meta name="theme-color" content="#003047">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lazurde Admin">
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" href="/admin/img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/admin/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --deep:#003047;--navy:#0B2E4F;--blue:#0F4C81;--blue-soft:#EAF1F8;
  --gold:#D3AE2A;--gold-l:#FAD26D;--gold-bg:#FFF6DF;--gold-ink:#7A5A0C;
  --bg:#F1F4F8;--card:#fff;--line:#E3E8EE;--muted:#5F6B7A;--ink2:#3D4A58;
  --ok:#16794A;--ok-bg:#E7F6EE;--bad:#B42318;--bad-bg:#FDEEEC;--grey:#5F6B7A;--grey-bg:#ECEFF3;
  --wa:#25D366;
  --r:20px;--shadow:0 1px 2px rgba(11,46,79,.06),0 6px 24px rgba(11,46,79,.06);
  --tabbar:64px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rs{display:inline-block;width:1.12em;height:.66em;background:currentColor;-webkit-mask:url(/booking/img/omr.svg) center/contain no-repeat;mask:url(/booking/img/omr.svg) center/contain no-repeat;margin-inline-end:.18em;vertical-align:baseline}
.money{white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 24px) 22px calc(var(--sab) + 24px);
  background:radial-gradient(120% 80% at 50% 0%,#145a78 0%,#003047 60%,#001f2f 100%);color:#fff;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(250,210,109,.18),transparent 65%);top:-140px;left:50%;transform:translateX(-50%)}
.login .lang{position:absolute;top:calc(var(--sat) + 14px);right:16px;height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(250,210,109,.5);color:#fff;font-weight:700;font-size:13px}
.login .logo{width:74px;filter:drop-shadow(0 8px 24px rgba(250,210,109,.35));position:relative}
.login .wm{width:170px;margin:18px 0 6px;position:relative}
.login .tag{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-l);font-weight:700;margin-bottom:34px;position:relative}
.login form{width:100%;max-width:380px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative}
.login label{font-size:13px;font-weight:700;color:rgba(255,255,255,.8)}
.pw{position:relative}
.pw input{width:100%;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.18);color:#fff;font-size:17px;padding:0 52px 0 16px;outline:none}
.pw input:focus{border-color:var(--gold-l)}
.pw button{position:absolute;right:6px;top:6px;width:42px;height:42px;border-radius:12px;color:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center}
.login .err{color:#FFB4A9;font-size:14px;font-weight:700;min-height:20px;text-align:center}
.btn-gold{height:54px;border-radius:16px;background:linear-gradient(180deg,#FAD26D,#D3AE2A);color:#002233;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(211,174,42,.35)}
.btn-gold:active{transform:scale(.98)}

/* ---------- Estructura ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{display:none}
.view{padding-bottom:calc(var(--tabbar) + var(--sab) + 24px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--tabbar) + var(--sab));padding-bottom:var(--sab);display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#8A95A3;position:relative}
.tabbar button[aria-current=page]{color:var(--deep)}
.tabbar button[aria-current=page] .ic{stroke-width:2.3}
.tabbar .dot,.side .dot{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#E5484D;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

/* Reloj en vivo */
.clock{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.hero .clock{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.16)}
.clock .lv{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:lv 2s infinite}
.clock.off .lv{background:#9AA5B1;animation:none}
.clock small{font-size:11px;font-weight:700;opacity:.7;letter-spacing:.04em}
@keyframes lv{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.side .sclock{margin:0 8px 22px;padding:14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.side .sclock b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.side .sclock span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(255,255,255,.7);font-weight:600;margin-top:4px}
.side .sclock .lv{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:lv 2s infinite}
.side .sclock.off .lv{background:#9AA5B1;animation:none}

/* Encabezado grande */
.hero{background:radial-gradient(130% 120% at 85% 0%,#14607f 0%,#003047 55%,#00263a 100%);color:#fff;padding:calc(var(--sat) + 18px) 20px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:calc(var(--sat) - 10px);width:190px;height:256px;background:url(/booking/img/stone.svg) center/contain no-repeat;opacity:.09;pointer-events:none}
.hero .row1{display:flex;align-items:center;gap:10px;margin-bottom:18px;position:relative;z-index:1}
.hero .row1 img{width:26px}
.hero .row1 .brand{flex:1;font-weight:800;letter-spacing:.2em;font-size:13px;color:var(--gold-l)}
.iconbtn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);color:#fff}
.hero h1{font-size:28px;font-weight:800;line-height:1.15;position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.75);font-size:15px;margin-top:6px;position:relative;z-index:1}
.today{margin-top:18px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px 14px;position:relative;z-index:1;width:100%;text-align:start;color:#fff}
.today .pulse{width:10px;height:10px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.2);flex:none}
.today .pulse.busy{background:var(--gold-l);box-shadow:0 0 0 4px rgba(250,210,109,.22)}
.today b{display:block;font-size:15px}
.today span{font-size:13px;color:rgba(255,255,255,.72)}

.top{position:sticky;top:0;z-index:20;background:rgba(241,244,248,.88);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);padding:calc(var(--sat) + 14px) 20px 10px}
.top .ttl{display:flex;align-items:center;gap:10px}
.top h1{flex:1;min-width:0;font-size:28px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none}
@media (max-width:400px){.top h1{font-size:25px}.top .clock small{display:none}}
@media (min-width:1000px){.top h1{font-size:30px}}
.top .iconbtn{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.wrap{padding:0 16px}
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 10px}
.sec-h h2{font-size:18px;font-weight:800}
.sec-h button{font-size:14px;font-weight:700;color:var(--blue)}

/* Tarjetas de números */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-14px 16px 0;position:relative;z-index:2}
.stat{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:start;min-height:104px}
.stat .k{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stat .k i{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal}
.stat .k .ic{width:17px;height:17px}
.stat .v{font-size:24px;font-weight:800;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--muted);font-weight:600}
.i-gold{background:var(--gold-bg);color:var(--gold-ink)}.i-blue{background:var(--blue-soft);color:var(--blue)}.i-green{background:var(--ok-bg);color:var(--ok)}.i-violet{background:#F0EDFB;color:#5B45B0}
.bar{height:6px;border-radius:9px;background:var(--grey-bg);overflow:hidden;margin-top:auto}
.bar span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#0F4C81,#14607f)}

/* Lista de reservas */
.list{display:flex;flex-direction:column;gap:10px}
.bk{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);width:100%;text-align:start;transition:transform .12s}
.bk:active{transform:scale(.985)}
.dt{width:56px;height:62px;border-radius:15px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--blue-soft);color:var(--blue)}
.dt small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.dt b{font-size:23px;font-weight:800;margin:3px 0 2px}
.dt.pending{background:var(--gold-bg);color:var(--gold-ink)}
.dt.confirmed{background:linear-gradient(160deg,#14607f,#003047);color:#fff}
.dt.rejected,.dt.cancelled{background:var(--grey-bg);color:var(--grey)}
.bk .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.bk .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .sb{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bk .tot{font-weight:800;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-pending{background:var(--gold-bg);color:var(--gold-ink)}.c-confirmed{background:var(--ok-bg);color:var(--ok)}
.c-rejected{background:var(--bad-bg);color:var(--bad)}.c-cancelled{background:var(--grey-bg);color:var(--grey)}
.empty{background:var(--card);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--muted);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600}
.empty .ic{width:34px;height:34px;color:#B6C0CC}
.alert{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FFF6DF,#FDEFC6);border:1px solid #F1DC9A;border-radius:var(--r);padding:14px;color:var(--gold-ink);font-weight:700;font-size:14.5px}
.alert .ic{color:var(--gold-ink)}
.mgroup{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:14px 4px 2px}

/* Buscador y filtros */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;height:44px;padding:0 12px;margin-top:12px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;border:0;outline:none;font-size:16px;background:none;color:var(--navy);min-width:0}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -20px 0;padding:0 20px 2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 14px;border-radius:999px;background:#fff;font-weight:700;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff}
.seg b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold-l);color:#002233;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}

/* Calendario */
.cal{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px 12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-h h2{font-size:18px;font-weight:800}
.cal-h .iconbtn{background:var(--bg);color:var(--navy)}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd span{text-align:center;font-size:11.5px;font-weight:800;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:15px;position:relative;background:#fff;border:1px solid var(--line);min-width:0;overflow:hidden}
.day small{font-size:9.5px;font-weight:700;max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.day.pad{visibility:hidden}
.day.past{opacity:.38}
.day.now{box-shadow:inset 0 0 0 2px var(--blue)}
.day.now:not(.confirmed):not(.pending)::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.day.confirmed{background:linear-gradient(160deg,#14607f,#003047);border-color:transparent;color:#fff}
.day.pending{background:var(--gold-bg);border-color:#F1DC9A;color:var(--gold-ink)}
.day.blocked{background:repeating-linear-gradient(135deg,#ECEFF3 0 6px,#E1E6EC 6px 12px);border-color:transparent;color:var(--grey)}
.day.sel{background:var(--blue-soft);border:2px solid var(--blue);color:var(--blue);transform:scale(.94)}
.day .hol{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:12px 6px 2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.msum div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.msum b{display:block;font-size:20px;font-weight:800}
.msum span{font-size:12px;font-weight:700;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted);font-weight:600;padding:12px 4px 0;line-height:1.45}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + var(--sab) + 10px);z-index:35;background:var(--deep);color:#fff;border-radius:20px;padding:12px;box-shadow:0 12px 40px rgba(0,32,50,.35);display:flex;flex-direction:column;gap:10px;animation:up .22s ease}
.selbar .r{display:flex;align-items:center;gap:10px}
.selbar .r b{flex:1;font-size:15px}
.selbar input{width:100%;height:44px;border-radius:12px;border:0;padding:0 12px;font-size:16px;color:var(--navy)}
.selbar .go{height:44px;padding:0 18px;border-radius:12px;background:var(--gold-l);color:#002233;font-weight:800}
.selbar .x{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}

/* Ajustes */
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:14px;width:100%;text-align:start;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item i{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.item .ic{width:19px;height:19px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15.5px}
.item .t span{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.4}
.sw{width:50px;height:30px;border-radius:999px;background:#D5DBE2;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34C759}.sw.on::after{transform:translateX(20px)}
.pillbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:13.5px;flex:none}
.steps{margin:0;padding:4px 14px 14px 40px;font-size:14px;line-height:1.55;color:var(--ink2);font-weight:600}
.segsm{display:flex;background:var(--bg);border-radius:12px;padding:3px;flex:none}
.segsm button{height:32px;padding:0 12px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.segsm button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ver{text-align:center;font-size:12px;color:#9AA5B1;font-weight:600;margin-top:22px}

/* Ficha de la reserva */
.scrim{position:fixed;inset:0;background:rgba(0,20,32,.42);z-index:50;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--sat) + 10px);z-index:51;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#C9D1DA;margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:8px 14px 10px;flex:none}
.sheet .sh .code{flex:1;font-weight:800;letter-spacing:.06em;color:var(--blue);font-size:15px}
.sheet .sh .iconbtn{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}
.sheet .foot{flex:none;padding:12px 16px calc(var(--sab) + 12px);background:#fff;border-top:1px solid var(--line);display:flex;gap:10px}
.g-name{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px}
.g-sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-top:4px}
.contact{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.contact a,.contact button{height:66px;border-radius:18px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:800;text-decoration:none;color:var(--navy)}
.contact .wa{color:#128C4A}
.contact [aria-disabled=true]{opacity:.4;pointer-events:none}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stay{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.stay .lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stay .d{font-size:18px;font-weight:800;margin-top:4px}
.stay .h{font-size:14px;font-weight:700;color:var(--blue);margin-top:2px}
.stay .arr{width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.fact{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.fact .ic{width:19px;height:19px;color:var(--muted)}
.fact span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.fact.wide{grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:600}
.rows div{display:flex;justify-content:space-between;gap:12px}
.rows .t{padding-top:10px;border-top:1px solid var(--line);font-size:19px;font-weight:800}
.dep{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--gold-bg);color:var(--gold-ink);border-radius:14px;padding:11px 12px;font-size:13.5px;font-weight:700}
.card h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;resize:vertical;outline:none;background:var(--bg)}
textarea:focus{border-color:var(--blue);background:#fff}
.savebtn{margin-top:10px;height:40px;padding:0 16px;border-radius:12px;background:var(--deep);color:#fff;font-weight:800;font-size:14px}
.savebtn:disabled{background:var(--grey-bg);color:#9AA5B1}
.msgcard{background:linear-gradient(135deg,#E9FBF0,#DDF7E8);border:1px solid #BDEBCF;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.msgcard p{font-size:14px;font-weight:700;color:#14532D;line-height:1.45}
.btn{height:52px;border-radius:16px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;text-decoration:none}
.btn-ok{background:linear-gradient(180deg,#1C8C57,#14703F);color:#fff;box-shadow:0 6px 18px rgba(22,121,74,.28)}
.btn-bad{background:#fff;color:var(--bad);border:1.5px solid #F2C6C0}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 6px 18px rgba(37,211,102,.3)}
.btn-ghost{background:var(--bg);color:var(--navy)}
.btn-navy{background:var(--deep);color:#fff}
.btn:active{transform:scale(.98)}

/* Diálogo */
.dlg{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(var(--sab) + 12px);background:rgba(0,20,32,.42);animation:fade .18s ease}
.dlg .box{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:22px 18px 16px;text-align:center;animation:up .22s ease}
.dlg .box i{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.dlg .box i .ic{width:28px;height:28px}
.dlg h3{font-size:19px;font-weight:800}
.dlg p{font-size:14.5px;color:var(--muted);font-weight:600;margin:8px 0 18px;line-height:1.45}
.dlg .bb{display:flex;gap:10px}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);z-index:90;background:var(--deep);color:#fff;padding:12px 16px;border-radius:16px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,32,50,.3);display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);animation:drop .25s ease}
.toast.new{background:linear-gradient(135deg,#FAD26D,#D3AE2A);color:#002233}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.skel{height:86px;border-radius:var(--r);background:linear-gradient(90deg,#fff 0%,#F6F8FA 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Computadora ---------- */
@media (min-width:1000px){
  :root{--tabbar:0px}
  .tabbar{display:none}
  .shell{display:grid;grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:radial-gradient(140% 60% at 0% 0%,#14607f 0%,#003047 55%,#00263a 100%);color:#fff;padding:26px 16px}
  .side .brand{display:flex;align-items:center;gap:12px;padding:0 8px 28px}
  .side .brand img{width:30px}
  .side .brand b{display:block;font-size:17px;letter-spacing:.18em;color:var(--gold-l)}
  .side .brand span{font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{height:48px;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:15px;color:rgba(255,255,255,.75);position:relative;text-align:start}
  .side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  .side nav button[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
  .side nav button[aria-current=page]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold-l)}
  .side .dot{position:static;margin-left:auto;border:0}
  .side .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.5);padding:0 10px}
  .view{padding:0 0 40px;max-width:1180px;width:100%}
  .hero{border-radius:0 0 32px 32px;padding:34px 36px 40px;margin:0 24px}
  .hero .row1{display:none}
  .hero h1{font-size:34px}
  .top{padding:30px 40px 12px;background:rgba(241,244,248,.92)}
  .top .clock{display:none}
  .wrap{padding:0 40px}
  .stats{grid-template-columns:repeat(4,1fr);margin:-22px 24px 0;padding:0 16px}
  .home-cols{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
  .seg{margin:12px 0 0;padding:0}
  .search{max-width:420px}
  .list.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cal-wrap{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
  .cal{padding:20px}
  .day{aspect-ratio:auto;height:84px;align-items:flex-start;justify-content:flex-start;padding:8px;font-size:15px}
  .day small{font-size:11.5px;padding:0;margin-top:auto}
  .msum{grid-template-columns:1fr;margin-top:0}
  .selbar{left:auto;right:28px;bottom:28px;width:380px}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .sheet{left:auto;top:0;width:480px;border-radius:0;animation:side .28s cubic-bezier(.2,.8,.2,1)}
  .sheet .grab{display:none}
  .sheet .sh{padding-top:18px}
  .dlg{align-items:center}
  .toast{top:auto;bottom:28px}
  @keyframes side{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      case 'pushoff': pushOff(); break;
      case 'pushtest': api('/push/test', { method: 'POST' }).then(function (j) { toast(j.ok ? x.sTestSent(j.sent) : x.error); }); break;
      case 'sound': S.sound = !S.sound; try { localStorage.setItem('lz-admin-sound', S.sound ? '1' : '0'); } catch (er) {} render(); break;
      case 'soundtest': unlockAudio(); chime(); break;
      case 'install': if (S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.then(function () { S.installEvt = null; render(); }); } break;
      case 'logout':
        ask(x.logout + '?', '', x.logout, 'bad').then(function (y) { if (y) api('/logout', { method: 'POST' }).then(toLogin); });
        break;
    }
  }
  app.addEventListener('click', onClick);
  layer.addEventListener('click', onClick);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.open && !document.querySelector('.dlg')) closeSheet(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; if (S.view === 'settings') render(); });

  // Se actualiza solo: cada 20 s y al volver a la app
  setInterval(function () { if (!document.hidden) load(true); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
  window.addEventListener('online', function () { load(true); });

  // ================= Inicio =================
  render();
  api('/me').then(function (j) {
    S.booting = false;
    if (j.ok || j.error === 'db_not_configured') {
      S.logged = true; render();
      load().then(function () { var c = (location.hash || '').slice(1); if (/^LZ-[A-Z0-9]{5}$/.test(c)) openSheet(c); });
      setupSW();
    } else render();
  }).catch(function () { S.booting = false; render(); });
})();
</script>
</body>
</html>
